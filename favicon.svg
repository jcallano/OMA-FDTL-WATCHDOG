<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="3" />

  <!-- Jet Airplane Shape -->
  <path d="M256 95 L276 210 L410 280 L410 310 L276 265 L276 375 L320 405 L320 425 L256 410 L192 425 L192 405 L236 375 L236 265 L102 310 L102 280 L236 210 Z" 
        fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />

  <!-- App Title -->
  <text x="256" y="475" font-family="sans-serif" font-size="42" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="6">OMAN AIR</text>
</svg>